# Two jobs on purpose. Linux is where this has always been developed and is the fast,
# cheap signal; macOS on Apple Silicon is the actual target and, until this workflow
# existed, no line of this code had ever run there (OQ-22). Running both means a macOS
# failure can be read immediately as platform-specific or not.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  linux:
    name: Linux (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg and Qt's own shared libraries
        # The fixtures shell out to a bare `ffmpeg`, so it has to be on PATH. On Linux
        # the distro build is fine: this job exists to check the logic, not the bundle.
        # The rest are what the PySide6 wheel's platform plugins link against. The UI
        # tests run on the `offscreen` platform, so no display is needed, but the plugin
        # still has to load and a missing libEGL is a plugin that will not. glib is the
        # fourth thing it links and is already on the runner image, so it is not named
        # here: its package was renamed for the 64 bit time_t transition and pinning
        # either spelling breaks on the other Ubuntu.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libdbus-1-3

      # setup-uv publishes no floating major tag (no v10), unlike checkout and cache,
      # so this is pinned to an exact release and has to be bumped by hand.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # uv.lock pins the whole dependency set, so a green run is reproducible and
          # the cache turns over exactly when the lock does.
          cache-dependency-glob: "uv.lock"
      - name: Create the environment
        # --frozen installs the lock as committed and fails if pyproject.toml has moved
        # ahead of it, which is the reminder to run `uv lock` and commit the result.
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Lint, format check and type check
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy proingest tests build

      - name: Tests
        run: .venv/bin/python -m pytest tests/ -q

  macos:
    name: macOS (Apple Silicon)
    # macos-latest is macos-26 and is arm64, which is the deployment target. It is a
    # standard runner, so it draws on included minutes rather than larger-runner billing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned ffmpeg
        uses: actions/cache@v6
        with:
          path: proingest/resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('build/ffmpeg.lock.json') }}

      - name: Fetch the pinned ffmpeg
        # 132 MB of arm64 Mach-O, verified by sha256 against build/ffmpeg.lock.json.
        # A stale cache cannot slip through: the script re-verifies every file it keeps.
        run: python3 build/fetch_ffmpeg.py

      - name: Put the bundled ffmpeg on PATH, and prove it runs
        # This is the whole point of the job. The dev machine tests against whatever
        # ffmpeg the distro ships (6.1.1 on Ubuntu); the product ships 9.0.1 from
        # martin-riedl.de and nothing had ever executed it. Bare `ffmpeg -version` here
        # also fails the job loudly rather than letting tests/conftest.py skip the whole
        # suite for a missing binary and report green, which is what `shutil.which`
        # returning None would otherwise cause.
        run: |
          echo "$GITHUB_WORKSPACE/proingest/resources/ffmpeg" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/proingest/resources/ffmpeg/ffmpeg" -hide_banner -version | head -1
          "$GITHUB_WORKSPACE/proingest/resources/ffmpeg/ffprobe" -hide_banner -version | head -1

      # setup-uv publishes no floating major tag (no v10), unlike checkout and cache,
      # so this is pinned to an exact release and has to be bumped by hand.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # uv.lock pins the whole dependency set, so a green run is reproducible and
          # the cache turns over exactly when the lock does.
          cache-dependency-glob: "uv.lock"
      - name: Create the environment
        # --frozen installs the lock as committed and fails if pyproject.toml has moved
        # ahead of it, which is the reminder to run `uv lock` and commit the result.
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Lint, format check and type check
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy proingest tests build

      - name: Tests
        run: .venv/bin/python -m pytest tests/ -q

      - name: Does h264_videotoolbox actually open a session
        # OQ-23. Presence in the build is not proof the encoder initialises on real
        # hardware, and that is only answerable on an actual Mac. Informational: a
        # failure here is an answer, not a broken build.
        continue-on-error: true
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=640x360:rate=24:duration=1 \
            -c:v h264_videotoolbox -q:v 65 -f mp4 -y /tmp/vt-probe.mp4 \
            && echo "h264_videotoolbox encoded 24 frames" \
            && ffprobe -hide_banner -v error -show_entries stream=codec_name,width,height \
                 -of default=noprint_wrappers=1 /tmp/vt-probe.mp4

  # Packaging (M7). Two jobs for the same reason the two test jobs exist: the macOS one
  # is the product and the Linux one is the cheap signal. Nothing ships from Linux, but
  # a spec that has stopped collecting a plugin manifest or has lost a hidden import
  # fails a Linux build exactly as it fails a macOS one, and finding that here costs a
  # free runner rather than a day of a rented Mac (`docs/MAC_SESSION.md`).
  package-linux:
    name: Package (Linux, spec check)
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg and Qt's own shared libraries
        # ffmpeg because the smoke test's fixtures generate their demo media with it,
        # and the Qt libraries because PyInstaller imports PySide6 to analyse it.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libdbus-1-3

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          cache-dependency-glob: "uv.lock"
      - name: Create the environment
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Build
        run: .venv/bin/python build/build.py

      - name: Smoke test the frozen build
        # Scans a fixture turnover, renders it through a two worker pool and writes both
        # spreadsheets, all through the packaged binary. See build/smoke_test.py.
        run: .venv/bin/python build/smoke_test.py dist/ProIngest/ProIngest

  package-macos:
    name: Package (Apple Silicon)
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned ffmpeg
        uses: actions/cache@v6
        with:
          path: proingest/resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('build/ffmpeg.lock.json') }}

      - name: Fetch the pinned ffmpeg
        # The bundle collects these two binaries, and build/build.py refuses to build a
        # macOS app without them rather than shipping one that cannot probe a file.
        run: python3 build/fetch_ffmpeg.py

      - name: Put the bundled ffmpeg on PATH
        # For the smoke test's fixtures, which shell out to a bare `ffmpeg`. The app
        # under test resolves its own copy from inside the bundle and ignores PATH.
        run: echo "$GITHUB_WORKSPACE/proingest/resources/ffmpeg" >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          cache-dependency-glob: "uv.lock"
      - name: Create the environment
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Build the app and the dmg
        # The size report goes to the run summary as well as the log: PRD section 8 sets
        # a 300 MB installer budget and this is the only place the number is measured.
        shell: bash
        run: |
          .venv/bin/python build/build.py | tee "$RUNNER_TEMP/build.log"
          {
            echo '### ProIngest bundle'
            echo '```'
            tail -n 6 "$RUNNER_TEMP/build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The shipped bundle says who it is
        # OQ-52. The identifier must never change once a build has reached the editor:
        # macOS keys folder access grants and Launch Services off it. Reading it back out
        # of the built app checks what actually shipped rather than the value that went in,
        # which is the only version of this check that would catch the spec dropping it.
        run: |
          built=$(plutil -extract CFBundleIdentifier raw "dist/ProIngest.app/Contents/Info.plist")
          want=$(.venv/bin/python -c 'from build import bundle; print(bundle.BUNDLE_IDENTIFIER)')
          echo "Info.plist says $built"
          [ "$built" = "$want" ]

      - name: Smoke test the frozen app
        run: .venv/bin/python build/smoke_test.py "dist/ProIngest.app/Contents/MacOS/ProIngest"

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: ProIngest-macos-arm64
          # The dmg rather than the `.app`, and not only because it is smaller: this
          # action zips what it is given, and a zip drops the symlinks and the execute
          # bits that a bundle is made of. A dmg arrives intact.
          path: dist/ProIngest-*.dmg
          if-no-files-found: error
