[project]
name = "proingest"
version = "0.1.0"
description = "VFX turnover ingest and conform tool"
requires-python = ">=3.11"
dependencies = [
    "opentimelineio>=0.17",
    # The CMX3600 adapter left otio core at 0.17; FR-1 needs it for the EDL fallback.
    "otio-cmx3600-adapter>=0.2",
    "numpy>=1.26",
    # 2.4 is the floor for the ACES 1.3 studio built-in config the colour session
    # is pinned to (COLOR_AND_FORMAT section 1, OQ-29). No config files ship.
    "opencolorio>=2.4",
    "openexr>=3.2",
    "openpyxl>=3.1",
    "xxhash>=3.4",
    "pyside6>=6.7",
]

[project.optional-dependencies]
# PyInstaller is a dev dependency rather than a build-only one because
# `build/bundle.py` imports its hook helpers, and that module is linted,
# type checked and covered by `tests/test_bundle.py` like any other.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.11"]

[project.scripts]
proingest = "proingest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proingest"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
# Runtime floor stays 3.11 (see requires-python); this is the dev interpreter.
# numpy's stubs use `type` statement syntax that mypy rejects under python_version
# 3.11, and pytest pulls numpy in transitively via _pytest.python_api.
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "opentimelineio.*",
    "OpenEXR.*",
    "xxhash.*",
    "PyOpenColorIO.*",
    "openpyxl.*",
    # PyInstaller ships no stubs; `build/bundle.py` uses two hook helpers.
    "PyInstaller.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
